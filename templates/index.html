<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Easy Data Bundles - USSD</title>
<style>
  :root {
    --bezel: #1c1c1e;
    --screen-bg: #eceef0;
    --dialog-bg: #ffffff;
    --text-main: #1a1a1a;
    --accent: #2f6fed;
    --divider: #d8dade;
    --error: #e74c3c;
    --success: #27ae60;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f1ea;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .phone {
    width: 320px;
    height: 640px;
    background: var(--bezel);
    border-radius: 40px;
    padding: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .screen {
    background: var(--screen-bg);
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .statusbar {
    height: 28px;
    background: var(--screen-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 12px;
    color: #444;
    flex-shrink: 0;
  }

  .ussd-header {
    background: #1a1a1a;
    color: white;
    padding: 8px 16px;
    font-size: 11px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  .stage {
    flex: 1;
    position: relative;
  }

  .dialog {
    position: absolute;
    left: 16px;
    right: 16px;
    top: 45%;
    transform: translateY(-50%);
    background: var(--dialog-bg);
    border-radius: 18px;
    padding: 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    max-height: 420px;
    overflow-y: auto;
  }

  .dialog-message {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text-main);
    white-space: pre-wrap;
    margin-bottom: 16px;
    min-height: 60px;
    max-height: 300px;
    overflow-y: auto;
  }

  .dialog-input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--accent);
    font-size: 15px;
    padding: 4px 2px 8px;
    outline: none;
    background: transparent;
    color: var(--text-main);
  }

  .dialog-input:disabled {
    opacity: 0.5;
    border-bottom-color: #ccc;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 22px;
    margin-top: 18px;
  }

  .dialog-actions button {
    border: none;
    background: none;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 2px;
  }

  #cancelBtn { color: #555; }
  #sendBtn { color: var(--accent); }
  #sendBtn:disabled { color: #a9bde6; cursor: default; }

  .end-banner {
    text-align: center;
    font-size: 12.5px;
    color: #6a6f76;
    margin-top: 14px;
  }

  .end-banner .success { color: var(--success); }
  .end-banner .error { color: var(--error); }

  .restart-row {
    display: flex;
    justify-content: center;
    margin-top: 8px;
  }

  .restart-row button {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
  }

  .dial-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    color: #8b8f96;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span id="clock">21:50</span>
        <span>📱 USSD</span>
      </div>
      <div class="ussd-header">
        <span>Easy Data Bundles</span>
      </div>

      <div class="stage">
        <div class="dialog">
          <div class="dialog-message" id="message">Loading...</div>
          <div id="inputRow">
            <input class="dialog-input" id="choiceInput" type="text" inputmode="numeric" placeholder="Enter option" autofocus>
          </div>
          <div class="dialog-actions" id="actions">
            <button id="cancelBtn">Cancel</button>
            <button id="sendBtn">Send</button>
          </div>
          <div class="end-banner" id="endBanner" style="display:none;">
            <span id="endStatus">Session ended</span>
          </div>
          <div class="restart-row" id="restartRow" style="display:none;">
            <button id="restartBtn">🔁 Start over</button>
          </div>
        </div>
        <div class="dial-hint">USSD Session</div>
      </div>
    </div>
  </div>

<script>
  const sessionId = "sim-" + Math.random().toString(36).slice(2);
  
  // Your actual USSD code (used internally, not displayed)
  const USSD_CODE = "*928*102#";

  const messageEl = document.getElementById("message");
  const inputEl = document.getElementById("choiceInput");
  const sendBtn = document.getElementById("sendBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const actionsEl = document.getElementById("actions");
  const inputRowEl = document.getElementById("inputRow");
  const endBannerEl = document.getElementById("endBanner");
  const endStatusEl = document.getElementById("endStatus");
  const restartRowEl = document.getElementById("restartRow");
  const restartBtn = document.getElementById("restartBtn");

  // Update clock
  function setClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.getHours().toString().padStart(2, "0") + ":" +
      now.getMinutes().toString().padStart(2, "0");
  }
  setClock();
  setInterval(setClock, 30000);

  async function callUssd(choice) {
    try {
      const res = await fetch("/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, choice })
      });
      
      if (!res.ok) {
        throw new Error(`Server error: ${res.status}`);
      }
      
      return await res.json();
    } catch (error) {
      return { 
        message: `❌ Connection error: ${error.message}\nPlease check if server is running.`, 
        ended: true 
      };
    }
  }

  function render(data) {
    messageEl.textContent = data.message;
    
    if (data.ended) {
      inputRowEl.style.display = "none";
      actionsEl.style.display = "none";
      endBannerEl.style.display = "block";
      restartRowEl.style.display = "flex";
      
      if (data.message.includes("payment") || 
          data.message.includes("approved") || 
          data.message.includes("sent") ||
          data.message.includes("prompt")) {
        endStatusEl.textContent = "✅ Payment initiated - Check your phone";
        endStatusEl.className = "success";
      } else if (data.message.includes("error") || 
                 data.message.includes("failed") || 
                 data.message.includes("Invalid") ||
                 data.message.includes("cancelled")) {
        endStatusEl.textContent = "❌ Session ended - Please try again";
        endStatusEl.className = "error";
      } else {
        endStatusEl.textContent = "📱 Session ended";
        endStatusEl.className = "";
      }
    } else {
      inputRowEl.style.display = "block";
      actionsEl.style.display = "flex";
      endBannerEl.style.display = "none";
      restartRowEl.style.display = "none";
      inputEl.value = "";
      inputEl.disabled = false;
      inputEl.focus();
      sendBtn.disabled = false;
    }
  }

  async function start() {
    messageEl.textContent = "⏳ Connecting...";
    inputEl.disabled = true;
    sendBtn.disabled = true;
    
    const data = await callUssd(null);
    render(data);
  }

  sendBtn.addEventListener("click", async () => {
    const val = inputEl.value.trim();
    if (!val) return;
    
    inputEl.disabled = true;
    sendBtn.disabled = true;
    messageEl.textContent = "⏳ Processing...";
    
    const data = await callUssd(val);
    render(data);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendBtn.click();
  });

  cancelBtn.addEventListener("click", () => {
    messageEl.textContent = "❌ Session cancelled by user.";
    inputRowEl.style.display = "none";
    actionsEl.style.display = "none";
    endBannerEl.style.display = "block";
    endStatusEl.textContent = "Session cancelled";
    endStatusEl.className = "error";
    restartRowEl.style.display = "flex";
  });

  restartBtn.addEventListener("click", () => {
    window.location.reload();
  });

  start();
</script>

</body>
</html>
